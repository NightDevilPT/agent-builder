version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: agent_builder_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: agent_builder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agent_builder_pgadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
